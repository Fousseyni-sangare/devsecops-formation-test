name: Build and publish frontend image

on:
  pull_request:
    branches:
      - dev
      - main
      - formation
    paths:
      - "src/**"
      - "public/**"
      - "types/**"
      - "Dockerfile"
      - ".dockerignore"
      - "nginx.conf"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - ".eslintrc.cjs"
      - ".github/workflows/build-push-ghcr.yml"

  workflow_run:
    workflows:
      - Security SAST and DAST
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devsecops-formation-test

jobs:
  validate:
    name: Validate frontend
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm exec -- tsc --noEmit

      - name: Build frontend
        run: npm run build

  pull-request-container:
    name: Build and test Pull Request container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Pull Request image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: devsecops-formation-test:pr-test

      - name: Start smoke test container
        run: |
          docker run --detach \
            --name frontend-smoke \
            --publish 8080:8080 \
            devsecops-formation-test:pr-test

      - name: Smoke test /healthz
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/healthz >/dev/null; then
              echo "Health check successful"
              exit 0
            fi

            echo "Waiting for the frontend container (${attempt}/15)"
            sleep 2
          done

          echo "Health check failed"
          docker logs frontend-smoke
          exit 1

      - name: Show container logs after a failure
        if: failure()
        run: docker logs frontend-smoke || true

      - name: Clean up smoke test container
        if: always()
        run: docker rm --force frontend-smoke 2>/dev/null || true

  publish-ghcr:
    name: Publish and sign validated image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    needs:
      - validate

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout validated source code # nosemgrep
        # Security justification:
        # - the triggering workflow completed successfully;
        # - it was triggered by a push on main;
        # - it originated from this repository;
        # - the exact validated SHA is checked out.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest

      - name: Build and publish validated image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate published digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The build did not return a valid SHA-256 digest:"
            echo "${IMAGE_DIGEST}"
            exit 1
          fi

          echo "Validated image digest: ${IMAGE_DIGEST}"

      - name: Verify BuildKit SBOM and provenance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE_REFERENCE="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "Inspecting attestations attached to:"
          echo "${IMAGE_REFERENCE}"

          SBOM="$(
            docker buildx imagetools inspect \
              "${IMAGE_REFERENCE}" \
              --format '{{json .SBOM}}'
          )"

          PROVENANCE="$(
            docker buildx imagetools inspect \
              "${IMAGE_REFERENCE}" \
              --format '{{json .Provenance}}'
          )"

          if [[ -z "${SBOM}" || "${SBOM}" == "null" || "${SBOM}" == "{}" ]]; then
            echo "No BuildKit SBOM was found for ${IMAGE_REFERENCE}"
            exit 1
          fi

          if [[ -z "${PROVENANCE}" ||
                "${PROVENANCE}" == "null" ||
                "${PROVENANCE}" == "{}" ]]; then
            echo "No BuildKit provenance was found for ${IMAGE_REFERENCE}"
            exit 1
          fi

          printf '%s\n' "${SBOM}" |
            jq --exit-status . >/dev/null

          printf '%s\n' "${PROVENANCE}" |
            jq --exit-status . >/dev/null

          echo "BuildKit SBOM found and valid."
          echo "BuildKit provenance found and valid."

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image with GitHub OIDC
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE_REFERENCE="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

          cosign sign --yes "${IMAGE_REFERENCE}"

          echo "Signed immutable image:"
          echo "${IMAGE_REFERENCE}"

      - name: Verify Cosign signature and signer identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE_REFERENCE="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          EXPECTED_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-push-ghcr.yml@refs/heads/main"
          EXPECTED_ISSUER="https://token.actions.githubusercontent.com"

          cosign verify \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
            "${IMAGE_REFERENCE}"

          echo "Cosign signature verified."
          echo "Expected signer: ${EXPECTED_IDENTITY}"
          echo "Expected OIDC issuer: ${EXPECTED_ISSUER}"