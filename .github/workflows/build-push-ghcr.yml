name: Build and publish frontend image

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kibarocert-frontend

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  container:
    name: Build and publish container
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Pull Request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: kibarocert-frontend:pr-test

      - name: Smoke test /healthz
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --rm \
            --name frontend-smoke \
            -p 8080:8080 \
            kibarocert-frontend:pr-test

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo "Health check successful"
              exit 0
            fi

            echo "Waiting for the frontend container..."
            sleep 2
          done

          echo "Health check failed"
          docker logs frontend-smoke
          exit 1

      - name: Build and publish main image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max