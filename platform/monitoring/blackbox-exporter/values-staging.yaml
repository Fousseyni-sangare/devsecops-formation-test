# HTTP probing component for the KibaroCert staging environment.

commonLabels:
  app.kubernetes.io/part-of: kibarocert
  app.kubernetes.io/component: blackbox-exporter
  app.kubernetes.io/environment: staging

automountServiceAccountToken: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes:
          - 200
        follow_redirects: true
        preferred_ip_protocol: ip4

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 128Mi

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9115

# Collect Blackbox Exporter's own operational metrics.
serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: monitoring
    interval: 30s
    scrapeTimeout: 10s

  # Application probes are managed by Prometheus Operator Probe resources.
  enabled: false

networkPolicy:
  enabled: true
  allowMonitoringNamespace: true
  monitoringNamespaceName: monitoring