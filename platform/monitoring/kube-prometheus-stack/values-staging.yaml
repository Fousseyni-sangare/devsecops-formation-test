# Observability stack for the KibaroCert Kubernetes staging environment.

commonLabels:
  app.kubernetes.io/part-of: kibarocert
  app.kubernetes.io/environment: staging

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    windows: false

# These control-plane metrics are not directly exposed by the staging cluster.
# Disabling their monitors prevents permanent DOWN targets and false alerts.
# Managed Kubernetes services such as GKE commonly expose control-plane
# observability through the cloud provider.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

# Grafana remains internal. Access will use kubectl port-forward.
grafana:
  enabled: true
  fullnameOverride: kibarocert-grafana

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Paris
  defaultDashboardsEditable: false

  ingress:
    enabled: false

  service:
    type: ClusterIP

  persistence:
    enabled: false

  # Grafana previously consumed approximately 255 Mi while its memory
  # limit was 256 Mi. The higher limit provides sufficient startup
  # and runtime headroom.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Grafana can take time to initialize dashboards and plugins.
  # During this period, liveness and readiness checks remain suspended.
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  # Dashboard and datasource sidecars share the Grafana Pod.
  # They therefore require distinct health ports.
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 192Mi

    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      env:
        HEALTH_PORT: "8081"

    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      uid: prometheus
      env:
        HEALTH_PORT: "8082"

# Alertmanager is enabled without external notification receivers for now.
alertmanager:
  enabled: true

  ingress:
    enabled: false

  service:
    type: ClusterIP

  alertmanagerSpec:
    replicas: 1
    retention: 24h

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi

# Prometheus stores three days of metrics on a 5 Gi persistent volume.
prometheus:
  enabled: true

  ingress:
    enabled: false

  service:
    type: ClusterIP

  prometheusSpec:
    replicas: 1
    retention: 3d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1200Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    # Custom monitors must carry the Helm release label.
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true

# Prometheus Operator manages Prometheus resources and CRDs.
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Kubernetes object-state metrics.
kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

# Node-level CPU, memory, filesystem and network metrics.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi