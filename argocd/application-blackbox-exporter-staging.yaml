apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibarocert-blackbox-exporter-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kibarocert
    app.kubernetes.io/component: observability
    app.kubernetes.io/environment: staging
spec:
  project: default

  sources:
    # Official Blackbox Exporter Helm chart.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.17.2
      helm:
        releaseName: blackbox-exporter
        valueFiles:
          - $values/platform/monitoring/blackbox-exporter/values-staging.yaml

    # Versioned staging values.
    - repoURL: git@github.com:yiriah/KibaroCert-Front.git
      targetRevision: main
      ref: values

    # Prometheus Probe and least-privilege NetworkPolicy.
    - repoURL: git@github.com:yiriah/KibaroCert-Front.git
      targetRevision: main
      path: platform/monitoring/blackbox-exporter/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m