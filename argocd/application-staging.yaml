apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibarocert-frontend-staging
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: kibarocert-frontend
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kibarocert-platform
    app.kubernetes.io/environment: staging

spec:
  project: default

  source:
    repoURL: git@github.com:yiriah/KibaroCert-Front.git

    # Staging deploys only the validated state merged into main.
    targetRevision: main

    # Staging has its own Kustomize overlay and immutable image digest.
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: kibarocert-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      # The namespace is declaratively managed by the staging overlay.
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m