apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibarocert-monitoring-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kibarocert
    app.kubernetes.io/component: observability
    app.kubernetes.io/environment: staging
spec:
  project: default

  sources:
    # Official kube-prometheus-stack Helm chart.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.3.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/kube-prometheus-stack/values-staging.yaml

    # Versioned staging values from the KibaroCert Git repository.
    - repoURL: git@github.com:yiriah/KibaroCert-Front.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Grafana generates the initial password inside this Kubernetes Secret.
  # Argo CD must not regenerate it during every reconciliation.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kibarocert-grafana
      jsonPointers:
        - /data/admin-password

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m