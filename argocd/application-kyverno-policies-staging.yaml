apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibarocert-kyverno-policies-staging
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: kibarocert-kyverno-policies
    app.kubernetes.io/component: policy-as-code
    app.kubernetes.io/part-of: kibarocert-platform
    app.kubernetes.io/environment: staging

spec:
  project: default

  source:
    repoURL: git@github.com:yiriah/KibaroCert-Front.git

    # Only policies validated and merged into main are deployed.
    targetRevision: main

    # Cluster-scoped Kyverno policies are separated from application resources.
    path: k8s/policies/staging

  destination:
    server: https://kubernetes.default.svc

    # Logical destination for policy-engine resources.
    # ImageValidatingPolicy remains cluster-scoped.
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m