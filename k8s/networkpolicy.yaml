apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibarocert-frontend
  namespace: kibarocert
  labels:
    app.kubernetes.io/name: kibarocert-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kibarocert-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kibarocert-frontend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080

  # Le frontend statique NGINX n’a pas besoin de créer des connexions
  # sortantes pour fonctionner.
  egress: []